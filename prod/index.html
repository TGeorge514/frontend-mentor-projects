<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/index.css">
  <link rel="stylesheet" href="./styles/media-queries-index.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

  <!-- Scripts -->
  <script src="./scripts/scripts.js" defer></script>

  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
</head>
<body>
  <main>
    <div>
      <h1>Stay updated!</h1>
    
      <p>Join 60,000+ product managers receiving monthly updates on:</p>
    
      <ul>
        <li><span><img src="../assets/images/icon-success.svg" alt="checkmark"></span>Product discovery and building what matters</li>
        <li><span><img src="../assets/images/icon-success.svg" alt="checkmark"></span>Measuring to ensure updates are a success</li>
        <li><span><img src="../assets/images/icon-success.svg" alt="checkmark"></span>And much more!</li>
      </ul>
      
      <!-- Sign-up form start -->
      <form action="./sucess.html" class="pageOneForm" method="get">
        <label for="user-email">Email address</label><br>
        <span id="errorPageOne"></span>
        <input type="email" class="form-control" placeholder="email@company.com" name="user-email"/><br>
        <button type="submit" class="btn btn-primary submit-form" id="submit-form-pageOne">Subscribe to monthly newsletter</button><br>
      </form>
      <!-- Sign-up form end -->
    </div>
    
    <div></div>
  </main>
  
  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://www.tigeorge.ca">Ti-George Web Services 2026</a>.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
