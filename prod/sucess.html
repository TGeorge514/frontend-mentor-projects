  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
     
    <!-- Scripts -->
    <script src="./scripts/scripts.js" defer></script>

    <title>Frontend Mentor | Newsletter sign-up form with success message</title>
    
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/success.css">
    <link rel="stylesheet" href="./styles/media-queries-success.css">
  </head>
  <body>
    <!-- Success message start -->
    <header>
      <span>
        <img src="../assets/images/icon-success.svg" alt="checkmark">
      </span>
      <h1>Thanks for subscribing!</h1>
    </header>

    <main>
      <p>
        A confirmation email has been sent to <span class="user-email"></span>.   <!-- user-email to be replaced dynamically in future -->
        Please open it and click the button inside to confirm your subscription.
      </p>
      <form action="./index.html"><button type="submit" class="submit-form btn btn-primary" id="submit-form-pageTwo">Dismiss message</button></form>
    </main>
    <!-- Success message end --> 

    <footer class="footer">
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://www.tigeorge.ca">Ti-George Web Services 2026</a>.
      </div>
    </footer>
  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
  </html>
